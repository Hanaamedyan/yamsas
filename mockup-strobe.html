  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"52890a92-e63c-4506-b701-b2b95f442a84\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  html,body{margin:0;padding:0;background:#111113;}\n  a{color:#7cc4ff;} a:hover{color:#a9d9ff;}\n  input[type=range]{accent-color:#e6e6e8;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:grid;grid-template-columns:1fr 320px;font-family:Helvetica,'Helvetica Neue',Arial,sans-serif;color:#e6e6e8;background:#111113\">\n\n  <div style=\"display:flex;flex-direction:column;min-width:0\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;padding:20px 28px 14px\">\n      <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">Device cutout<\u002Fdiv>\n      <div style=\"font-size:12px;color:#75757c;font-family:ui-monospace,Menlo,monospace\">{{ sizeLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:0 28px 8px;min-height:0\">\n      <div style=\"padding:18px;border-radius:10px;background:{{ stageBg }};background-size:20px 20px;background-position:0 0,10px 10px;box-shadow:0 0 0 1px #26262b;display:flex\">\n        <canvas ref=\"{{ canvasRef }}\" style=\"max-width:100%;display:block\"><\u002Fcanvas>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:14px;padding:14px 28px 24px\">\n      <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"width:40px;height:40px;border:none;border-radius:20px;background:#e6e6e8;color:#111113;font-size:13px;cursor:pointer;flex:none\">{{ playIcon }}<\u002Fbutton>\n      <input type=\"range\" min=\"0\" max=\"1000\" value=\"{{ scrub }}\" sc-camel-on-change=\"{{ onScrub }}\" style=\"flex:1;height:3px\">\n      <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#9a9aa2;min-width:86px;text-align:right\">{{ timeLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-left:1px solid #26262b;padding:22px 24px;display:flex;flex-direction:column;gap:22px;background:#0d0d0f;overflow:auto\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:#75757c\">Layout<\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px\">\n        <button sc-camel-on-click=\"{{ showBoth }}\" style=\"padding:8px 0;font-size:12px;font-family:inherit;border-radius:6px;cursor:pointer;border:1px solid {{ ringBoth }};background:{{ fillBoth }};color:{{ textBoth }}\">Both<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ showLap }}\" style=\"padding:8px 0;font-size:12px;font-family:inherit;border-radius:6px;cursor:pointer;border:1px solid {{ ringLap }};background:{{ fillLap }};color:{{ textLap }}\">Laptop<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ showPhone }}\" style=\"padding:8px 0;font-size:12px;font-family:inherit;border-radius:6px;cursor:pointer;border:1px solid {{ ringPhone }};background:{{ fillPhone }};color:{{ textPhone }}\">Phone<\u002Fbutton>\n      <\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"display:flex;justify-content:space-between;font-size:13px\"><span>Phone size<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:#9a9aa2\">{{ relLabel }}<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"30\" max=\"110\" value=\"{{ rel }}\" sc-camel-on-change=\"{{ setRel }}\" style=\"width:100%;height:3px\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"display:flex;justify-content:space-between;font-size:13px\"><span>Gap<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:#9a9aa2\">{{ gap }} px<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"-120\" max=\"240\" value=\"{{ gap }}\" sc-camel-on-change=\"{{ setGap }}\" style=\"width:100%;height:3px\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer\">\n        <input type=\"checkbox\" checked=\"{{ phoneFirst }}\" sc-camel-on-change=\"{{ togglePhoneFirst }}\" style=\"accent-color:#e6e6e8;width:14px;height:14px\">\n        <span>Phone on the left<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:#75757c\">Matte<\u002Fdiv>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"display:flex;justify-content:space-between;font-size:13px\"><span>Background tolerance<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:#9a9aa2\">{{ tol }}<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"5\" max=\"120\" value=\"{{ tol }}\" sc-camel-on-change=\"{{ setTol }}\" style=\"width:100%;height:3px\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"display:flex;justify-content:space-between;font-size:13px\"><span>Edge start<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:#9a9aa2\">{{ e0 }}<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"0\" max=\"60\" value=\"{{ e0 }}\" sc-camel-on-change=\"{{ setE0 }}\" style=\"width:100%;height:3px\">\n      <\u002Flabel>\n\n      <label style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"display:flex;justify-content:space-between;font-size:13px\"><span>Edge end<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:#9a9aa2\">{{ e1 }}<\u002Fspan><\u002Fspan>\n        <input type=\"range\" min=\"4\" max=\"140\" value=\"{{ e1 }}\" sc-camel-on-change=\"{{ setE1 }}\" style=\"width:100%;height:3px\">\n      <\u002Flabel>\n\n      < ing:11px 14px;border:1px solid #33333a;border-radius:7px;background:transparent;color:#e6e6e8;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#55555f\">This frame as PNG<\u002Fbutton>\n      <div style=\"font-size:12px;color:#75757c;line-height:1.5;min-height:34px\">{{ status }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:820},&quot;devices&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;lap&quot;,&quot;phone&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;phoneSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;min&quot;:30,&quot;max&quot;:110,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:56,&quot;min&quot;:-120,&quot;max&quot;:240,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;phoneOnLeft&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;tolerance&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:45,&quot;min&quot;:5,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Matte&quot;},&quot;edgeStart&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:26,&quot;min&quot;:0,&quot;max&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Matte&quot;},&quot;edgeEnd&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:52,&quot;min&quot;:4,&quot;max&quot;:140,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Matte&quot;},&quot;removeFringe&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Matte&quot;},&quot;previewBackground&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;checker&quot;,&quot;black&quot;,&quot;white&quot;,&quot;accent&quot;],&quot;default&quot;:&quot;checker&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preview&quot;}}\">\nconst RES = (window.__resources || {});\nconst CLIPS = {\n  lap: { src: RES.lapVideo || 'uploads/mockup desktop strobe.mp4', h: 600 },\n  phone: { src: RES.phoneVideo || 'uploads/mockup iphone strobe.mp4', h: 600 }\n};\nconst PAD = 44;\n\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    this.state = {\n      ready: false, playing: false, t: 0, dur: 0,\n      tol: p.tolerance ?? 45, e0: p.edgeStart ?? 26, e1: p.edgeEnd ?? 52,\n      spill: p.removeFringe ?? true,\n      devices: p.devices ?? 'both', rel: p.phoneSize ?? 56, gap: p.gap ?? 56,\n      phoneFirst: p.phoneOnLeft ?? false,\n      bg: p.previewBackground ?? 'checker', status: 'Loading clips…'\n    };\n    this.canvasRef = React.createRef();\n    this.srcs = {};\n  }\n\n  makeSrc(key) {\n    return new Promise(res => {\n      const cfg = CLIPS[key];\n      const v = document.createElement('video');\n      v.src = cfg.src.startsWith('blob:') ? cfg.src : encodeURI(cfg.src);\n      v.muted = true; v.playsInline = true; v.preload = 'auto';\n      const s = { key, video: v, ready: false };\n      v.addEventListener('loadeddata', () => {\n        if (s.ready) return;\n        s.ready = true;\n        s.w = v.videoWidth; s.h = v.videoHeight; s.dur = v.duration;\n        const n = s.w * s.h;\n        s.work = document.createElement('canvas'); s.work.width = s.w; s.work.height = s.h;\n        s.wctx = s.work.getContext('2d', { willReadFrequently: true });\n        s.out = document.createElement('canvas'); s.out.width = s.w; s.out.height = s.h;\n        s.octx = s.out.getContext paint();\n      const lead = this.srcs.lap;\n      const now = performance.now();\n      if (lead && (!this.lastUi || now - this.lastUi > 120)) { this.lastUi = now; this.setState({ t: lead.video.currentTime }); }\n    }\n  };\n\n  process(s) {\n    const w = s.w, h = s.h;\n    s.wctx.drawImage(s.video, 0, 0, w, h);\n    const id = s.wctx.getImageData(0, 0, w, h), d = id.data;\n    const tol = this.state.tol, e0 = this.state.e0, e1 = Math.max(this.state.e1, this.state.e0 + 1);\n    const mask = s.mask, A = s.A, bg = s.bgRow;\n    mask.fill(0);\n\n    // Per-row background: take the brighter of the two edge samples, and for rows where a\n    // device covers both edges, inherit from the nearest row that had a valid sample.\n    const cand = s.cand, cl = s.cl, ref = s.rowRef;\n    let maxL = 0;\n    for (let y = 0; y < h; y++) {\n      let lr = 0, lg = 0, lb = 0, rr = 0, rg = 0, rb = 0;\n      for (let k = 0; k < 3; k++) {\n        let i = (y * w + k) * 4; lr += d[i]; lg += d[i + 1]; lb += d[i + 2];\n        i = (y * w + (w - 1 - k)) * 4; rr += d[i]; rg += d[i + 1]; rb += d[i + 2];\n      }\n      lr /= 3; lg /= 3; lb /= 3; rr /= 3; rg /= 3; rb /= 3;\n      const ll = 0.299 * lr + 0.587 * lg + 0.114 * lb;\n      const rl = 0.299 * rr + 0.587 * rg + 0.114 * rb;\n      const j = y * 3;\n      if (ll >= rl) { cand[j] = lr; cand[j + 1] = lg; cand[j + 2] = lb; cl[y] = ll; }\n      else { cand[j] = rr; cand[j + 1] = rg; cand[j + 2] = rb; cl[y] = rl; }\n      if (cl[y] > maxL) maxL = cl[y];\n    }\n    const minOk = maxL - 70;\n    let prev = -1;\n    for (let y = 0; y < h; y++) { if (cl[y] >= minOk) { prev = y; ref[y] = y; } else ref[y] = prev; }\n    let next = -1;\n    for (let y = h - 1; y >= 0; y--) {\n      if (cl[y] >= minOk) { next = y; continue; }\n      const p = ref[y];\n      if (p < 0) ref[y] = next;\n      else if (next >= 0 && (next - y) < (y - p)) ref[y] = next;\n    }\n    for (let y = 0; y < h; y++) {\n      const r = ref[y] < 0 ? 0 : ref[y], j = y * 3, k = r * 3;\n      bg[j] = cand[k]; bg[j + 1] = cand[k + 1]; bg[j + 2] = cand[k + 2];\n    }\n    const dist = (x, y) => {\n      const i = (y * w + x) * 4, j = y * 3;\n      const a = Math.abs(d[i] - bg[j]), b2 = Math.abs(d[i + 1] - bg[j + 1]), c = Math.abs(d[i + 2] - bg[j + 2]);\n      return a > b2 ? (a > c ? a : c) : (b2 > c ? b2 : c);\n    };\n\n    const st = [];\n    for (let x = 0; x < w; x++) { if (dist(x, 0) < tol) st.push(x, 0); if (dist(x, h - 1) < tol) st.push(x, h - 1); }\n    for (let y = 0; y < h; y++) { if (dist(0, y) < tol) st.push(0, y); if (dist(w - 1, y) < tol) st.push(w - 1, y); }\n    while (st.length) {\n      const y = st.pop(), x = st.pop();\n      if (mask[y * w + x]) continue;\n      let x1 = x; while (x1 >= 0 && !mask[y * w + x1] && dist(x1, y) < tol) x1--; x1++;\n      let x2 = x; while (x2 < w && !mask[y * w + x2] && dist(x2, y) < tol) x2++; x2--;\n      for (let xx = x1; xx <= x2; xx++) mask[y * w + xx] = 1;\n      for (let sgn = 0; sgn < 2; sgn++) {\n        const ny = sgn ? y + 1 : y - 1;\n        if (ny < 0 || ny >= h) continue;\n        let inside = false;\n        for (let xx = x1; xx <= x2; xx++) {\n          const ok = !mask[ny * w + xx] && dist(xx, ny) < tol;\n          if (ok && !inside) { st.push(xx, ny); inside = true; }\n          else if (!ok) inside = false;\n        }\n      }\n    }\n\n    const span = e1 - e0;\n    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n      const i = y * w + x;\n      if (!mask[i]) { A[i] = 1; continue; }\n      const dd = dist(x, y);\n      A[i] = dd <= e0 ? 0 : dd >= e1 ? 1 : (dd - e0) / span;\n    }\n\n    const spill = this.state.spill;\n    let bx0 = w, by0 = h, bx1 = -1, by1 = -1;\n    for (let y = 0; y < h; y++) {\n      const j = y * 3, br = bg[j], bgc = bg[j + 1], bb = bg[j + 2];\n      for (let x = 0; x < w; x++) {\n        const i = y * w + x, a = A[i], p = i * 4;\n        if (a <= 0) { d[p + 3] = 0; continue; }\n        if (a < 1 && spill) {\n          const r = (d[p] - br t.checked }, () => { this.dirty = true; }),\n      setRel: e => this.setState({ rel: +e.target.value }, () => this.relayout()),\n      setGap: e => this.setState({ gap: +e.target.value }, () => this.relayout()),\n      togglePhoneFirst: e => this.setState({ phoneFirst: e.target.checked }, () => this.relayout()),\n      showBoth: () => this.setState({ devices: 'both' }, () => this.relayout()),\n      showLap: () => this.setState({ devices: 'lap' }, () => this.relayout()),\n      showPhone: () => this.setState({ devices: 'phone' }, () => this.relayout()),\n      bgChecker: () => this.setState({ bg: 'checker' }),\n      bgBlack: () => this.setState({ bg: 'black' }),\n      bgWhite: () => this.setState({ bg: 'white' }),\n      bgAccent: () => this.setState({ bg: 'accent' }),\n      exportPng: () => {\n        const c = this.canvasRef.current; if (!c) return;\n        c.toBlob(b => { this.download(b, 'devices-frame.png'); this.setState({ status: 'Saved devices-frame.png' }); });\n      },\n      exportVideo: async () => {\n        if (this.recording || !this.state.ready) return;\n        const c = this.canvasRef.current; if (!c) return;\n        let mime = 'video/webm;codecs=vp8';\n        if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';\n        this.recording = true;\n        this.setState({ status: 'Recording… plays through once.' });\n        const vids = Object.values(this.srcs).map(x => x.video);\n        vids.forEach(v => v.pause());\n        await this.seekAll(0);\n        this.dirty = true; this.loop();\n        const stream = c.captureStream(30);\n        const chunks = [];\n        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 20000000 });\n        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };\n        const stopped = new Promise(r => { rec.onstop = r; });\n        rec.start();\n        vids.forEach(v => v.play());\n        this.setState({ playing: true });\n        const lead = this.srcs.lap.video;\n        await new Promise(r => {\n          const f = () => { if (lead.currentTime >= this.dur - 0.06) { lead.removeEventListener('timeupdate', f); r(); } };\n          lead.addEventListener('timeupdate', f);\n          lead.addEventListener('ended', () => { lead.removeEventListener('timeupdate', f); r(); }, { once: true });\n        });\n        await new Promise(r => setTimeout(r, 250));\n        rec.stop(); await stopped;\n        this.recording = false;\n        vids.forEach(v => v.pause());\n        this.setState({ playing: false });\n        this.download(new Blob(chunks, { type: 'video/webm' }), 'devices-transparent.webm');\n        this.setState({ status: 'Saved devices-transparent.webm — alpha preserved (VP8).' });\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
